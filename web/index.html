<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B52">
<title>TradeVoice</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230E6B52'/><text x='50' y='66' font-size='50' text-anchor='middle'>🗣️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="avatar">🗣️</div>
    <div class="who">
      <div class="name">TradeVoice</div>
      <div class="sub" id="sub">online</div>
    </div>
    <button class="pill" id="speakLang" title="I'm speaking">🗣️ <span>English</span> ▾</button>
    <button class="icon" id="menuBtn" aria-label="Menu">⋮</button>
  </header>

  <main>
    <!-- 💬 chat (home) -->
    <section id="talk" class="screen active">
      <div class="chat" id="chat"></div>
    </section>

    <!-- 📒 book -->
    <section id="book" class="screen">
      <button class="read" data-screen="today">🔊 Read it to me</button>
      <div id="bookBody"></div>
    </section>

    <!-- 👥 customers: list + one conversation per customer -->
    <section id="customers" class="screen">
      <div class="cwrap">
        <div class="clist">
          <div class="chead"><div class="csum" id="csum"></div><button class="small" id="newCust">+ New customer</button></div>
          <input class="csearch" id="csearch" type="search" autocomplete="off">
          <div class="cfilters" id="cfilters"></div>
          <button class="read slim" data-screen="owes">🔊 Read it to me</button>
          <div id="crows"></div>
        </div>
        <div class="cthread" id="cthread"></div>
      </div>
    </section>

    <!-- 🤝 debts (kept for old links; the Customers tab replaces it) -->
    <section id="debts" class="screen">
      <div id="debtsBody"></div>
    </section>

    <!-- 🔮 insights -->
    <section id="insights" class="screen">
      <button class="read" data-screen="insights">🔊 Read it to me</button>
      <div id="insightsBody"></div>
    </section>

    <!-- 🏦 profile -->
    <section id="profile" class="screen">
      <button class="read" data-screen="profile">🔊 Read it to me</button>
      <div id="profileBody"></div>
    </section>
  </main>

  <footer class="composer" id="composer">
    <div class="box">
      <input id="text" autocomplete="off" placeholder="Message" enterkeyhint="send">
      <label class="icon attach" title="Snap your book">📎
        <input type="file" id="photo" accept="image/*" capture="environment" hidden>
      </label>
    </div>
    <button class="round" id="mic" aria-label="Hold to talk">🎤</button>
  </footer>
  <div class="recbar" id="recbar"><span class="dot"></span><span id="recTime">0:00</span>
    <span id="recHint">Recording… let go to send</span></div>

  <nav class="tabs">
    <button data-tab="talk" class="on"><b>💬</b><span data-t="nav_talk">Chat</span></button>
    <button data-tab="book"><b>📒</b><span data-t="nav_book">Book</span></button>
    <button data-tab="customers"><b>👥</b><span data-t="nav_customers">Customers</span></button>
    <button data-tab="insights"><b>🔮</b><span data-t="nav_insights">Insights</span></button>
    <button data-tab="profile"><b>🏦</b><span data-t="nav_profile">Profile</span></button>
  </nav>
</div>

<!-- first open -->
<div class="overlay" id="welcome" hidden>
  <div class="welcome">
    <div class="bigavatar">🗣️</div>
    <h1 data-t="welcome">Welcome to TradeVoice</h1>
    <div class="langs" id="welcomeLangs"></div>
    <p class="consent" data-t="consent"></p>
    <button class="primary" id="agree" data-t="agree">Agree and continue</button>
  </div>
</div>

<!-- menus -->
<div class="overlay" id="sheet" hidden><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<audio id="player" preload="none"></audio>
<script src="/static/app.js"></script>
<script src="/static/customers.js"></script>
</body>
</html>
