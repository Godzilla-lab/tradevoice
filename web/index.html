<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1726" media="(prefers-color-scheme: dark)">
<title>TradeVoice</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <img class="logo" src="/static/logo.svg" alt="" width="34" height="34">
    <div class="who">
      <div class="hi" id="hi">TradeVoice</div>
      <div class="sub" id="sub"></div>
    </div>
    <button class="icon" id="eyeBtn" aria-label="Hide amounts"></button>
    <button class="pill" id="speakLang" title="Language"><span>English</span> <i data-icon="chev"></i></button>
    <button class="icon" id="viewBtn" aria-label="WhatsApp view" title="WhatsApp view" hidden></button>
  </header>

  <main>
    <!-- 🏠 home: today, who owes, quick actions, insight, recent -->
    <section id="home" class="screen active"><div id="homeBody"></div></section>

    <!-- 💬 talk: the chat (opened by the big mic) -->
    <section id="talk" class="screen">
      <div class="chat" id="chat"></div>
    </section>

    <!-- 👥 customers: list + one ledger per customer -->
    <section id="customers" class="screen">
      <div class="cwrap">
        <div class="clist">
          <div class="shead"><h1 data-t="nav_customers">Customers</h1>
            <button class="read ask" data-screen="owes"><i data-icon="mic"></i><span>Ask</span></button></div>
          <div class="csum" id="csum"></div>
          <div class="csearchrow"><input class="csearch" id="csearch" type="search" autocomplete="off">
            <button class="addbtn" id="newCust" aria-label="New customer"></button></div>
          <div class="cfilters" id="cfilters"></div>
          <div id="crows"></div>
        </div>
        <div class="cthread" id="cthread"></div>
      </div>
    </section>

    <!-- 🔮 insights -->
    <section id="insights" class="screen">
      <div class="shead"><h1 data-t="next_week">Next 7 days</h1><button class="read ask" data-screen="insights"><i data-icon="mic"></i><span>Ask</span></button></div>
      <div id="insightsBody"></div>
    </section>

    <!-- 👤 me: score, lender, year, tax, settings -->
    <section id="profile" class="screen">
      <div class="shead"><h1 data-t="nav_me">Me</h1><button class="read ask" data-screen="profile"><i data-icon="mic"></i><span>Ask</span></button></div>
      <div id="profileBody"></div>
    </section>
  </main>

  <footer class="composer" id="composer">
    <div class="box">
      <input id="text" autocomplete="off" placeholder="Message" enterkeyhint="send">
      <label class="icon attach" title="Snap your book" data-icon="camera">
        <input type="file" id="photo" accept="image/*" capture="environment" hidden>
      </label>
    </div>
    <button class="round" id="mic" aria-label="Hold to talk" data-icon="mic"></button>
  </footer>
  <div class="recbar" id="recbar"><span class="dot"></span><span id="recTime">0:00</span>
    <span id="recHint">Recording… let go to send</span></div>

  <nav class="tabs">
    <button data-tab="home" class="on"><b data-icon="home"></b><span data-t="nav_home">Home</span></button>
    <button data-tab="customers"><b data-icon="users"></b><span data-t="nav_customers">Customers</span></button>
    <button data-tab="talk" class="fab" aria-label="Talk"><b data-icon="mic"></b><span data-t="talk_btn">Talk</span></button>
    <button data-tab="insights"><b data-icon="chart"></b><span data-t="nav_insights">Insights</span></button>
    <button data-tab="profile"><b data-icon="person"></b><span data-t="nav_me">Me</span></button>
  </nav>
</div>

<!-- 🔐 log in with your phone number (then shop name + consent) -->
<div class="overlay login" id="login" hidden>
  <div class="lcard">
    <img class="biglogo" src="/static/logo.svg" alt="TradeVoice" width="72" height="72">
    <div class="langs" id="loginLangs"></div>
    <div id="loginStep"></div>
  </div>
</div>

<div class="overlay" id="sheet" hidden><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<audio id="player" preload="none"></audio>
<script src="/static/app.js"></script>
<script src="/static/customers.js"></script>
</body>
</html>
